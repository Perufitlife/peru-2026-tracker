<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ONPE 2026 — 2da Vuelta · Diseño limpio y minimalista
   ============================================================ */

:root {
  --bg: #F4F5F8;
  --bg-grad-1: #F8FAFC;
  --bg-grad-2: #EEF2F7;
  --card: #FFFFFF;
  --card-soft: #F9FAFB;
  --text: #0F172A;
  --text-muted: #64748B;
  --text-faint: #94A3B8;
  --border: #E2E8F0;
  --border-soft: #F1F5F9;
  --keiko: #F97316;
  --keiko-bg: #FFEDD5;
  --keiko-dark: #C2410C;
  --sanchez: #2563EB;
  --sanchez-bg: #DBEAFE;
  --sanchez-dark: #1D4ED8;
  --green: #10B981;
  --green-bg: #D1FAE5;
  --yellow: #F59E0B;
  --yellow-bg: #FEF3C7;
  --red: #EF4444;
  --red-bg: #FEE2E2;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 14px rgba(15,23,42,0.06);
  --shadow-lg: 0 12px 32px rgba(15,23,42,0.08);
  --radius: 18px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
body {
  background: linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2));
  color: var(--text);
  min-height: 100vh;
  padding: 16px 14px 32px;
  font-feature-settings: "ss01", "cv01", "cv02";
}
.container { max-width: 720px; margin: 0 auto; }
a { color: var(--sanchez); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ============================================================
   HEADER GLOBAL — countdown + ganador actual
   ============================================================ */
.gh-card {
  background: linear-gradient(135deg, #0B1220 0%, #1E293B 100%);
  color: white;
  border-radius: var(--radius);
  padding: 22px 22px 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.gh-card::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 0% 0%, rgba(249,115,22,0.18), transparent 50%),
              radial-gradient(circle at 100% 0%, rgba(37,99,235,0.18), transparent 50%);
  pointer-events: none;
}
.gh-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; position: relative; }
.gh-brand { display: flex; align-items: center; gap: 12px; }
.gh-logo { font-size: 1.8rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
.gh-title { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.3px; line-height: 1.2; }
.gh-sub { font-size: 0.75rem; opacity: 0.7; margin-top: 2px; font-weight: 500; }
.gh-countdown { text-align: right; }
.gh-cd-num { font-size: 2.2rem; font-weight: 800; line-height: 1; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; background: linear-gradient(135deg, #FB923C, #F59E0B); -webkit-background-clip: text; background-clip: text; color: transparent; }
.gh-cd-lbl { font-size: 0.6rem; opacity: 0.65; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 4px; }
.gh-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 16px 0 8px; background: rgba(255,255,255,0.08); position: relative; }
.gh-bar-k { background: linear-gradient(90deg, #FB923C, #F97316); }
.gh-bar-s { background: linear-gradient(90deg, #3B82F6, #2563EB); }
.gh-foot { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; position: relative; gap: 8px; }
.gh-side { display: flex; align-items: center; gap: 5px; font-weight: 600; opacity: 0.9; }
.gh-side.k { color: #FB923C; }
.gh-side.s { color: #60A5FA; }
.gh-side b { color: white; font-weight: 800; }
.gh-dot { width: 8px; height: 8px; border-radius: 50%; }
.gh-side.k .gh-dot { background: #F97316; }
.gh-side.s .gh-dot { background: #2563EB; }
.gh-mid { font-size: 0.65rem; opacity: 0.55; font-weight: 500; text-align: center; flex: 1; }

/* ============================================================
   SUB-NAVEGACIÓN
   ============================================================ */
.subnav {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  background: white;
  padding: 4px;
  border-radius: var(--radius);
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-soft);
}
.subnav-btn {
  background: none; border: none; padding: 10px 4px; border-radius: 12px;
  font-size: 0.7rem; font-weight: 700; color: var(--text-muted);
  cursor: pointer; transition: all 0.18s;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.subnav-btn:hover { color: var(--text); background: var(--card-soft); }
.subnav-btn.active {
  background: var(--text);
  color: white;
  box-shadow: 0 2px 8px rgba(15,23,42,0.20);
}
.snb-icon { font-size: 1rem; line-height: 1; }
.snb-label { font-size: 0.7rem; letter-spacing: 0.2px; }

/* ============================================================
   TARJETAS GENERALES
   ============================================================ */
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-soft);
}
.card-title { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text); margin-bottom: 6px; }
.card-title.light { color: rgba(255,255,255,0.95); }
.card-sub { font-size: 0.74rem; color: var(--text-muted); line-height: 1.45; margin-bottom: 14px; }
.card-foot { font-size: 0.7rem; color: var(--text-muted); line-height: 1.55; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
.card-foot b { color: var(--text); }
.loading { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

/* ============================================================
   HERO CARD — Ganador proyectado
   ============================================================ */
.hero-card {
  text-align: center;
  padding: 26px 20px 22px;
  background: white;
  border: 1px solid var(--border-soft);
  position: relative;
  overflow: hidden;
}
.hero-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
}
.hero-card.hero-k::before { background: linear-gradient(90deg, #FB923C, #F97316); }
.hero-card.hero-s::before { background: linear-gradient(90deg, #3B82F6, #2563EB); }
.hero-label { font-size: 0.62rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
.hero-winner { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 18px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.hero-card.hero-k .hero-winner { color: var(--keiko-dark); }
.hero-card.hero-s .hero-winner { color: var(--sanchez-dark); }
.hero-pcts { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; margin-bottom: 14px; }
.hp-side { text-align: center; }
.hp-name { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
.hp-side.k .hp-pct { color: var(--keiko); }
.hp-side.s .hp-pct { color: var(--sanchez); }
.hp-pct { font-size: 2.8rem; font-weight: 800; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
.hp-votes { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.hp-vs { font-size: 0.8rem; font-weight: 700; color: var(--text-faint); }
.hero-margin { font-size: 0.78rem; color: var(--text-muted); margin-top: 6px; }
.hero-margin b { color: var(--text); }
.hero-prob { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 0.7rem; color: var(--text-muted); text-align: left; }
.hero-prob-bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin-top: 8px; background: var(--border-soft); font-size: 0.7rem; font-weight: 700; color: white; }
.hpb-k, .hpb-s { display: flex; align-items: center; justify-content: center; }
.hpb-k { background: linear-gradient(90deg, #FB923C, #F97316); }
.hpb-s { background: linear-gradient(90deg, #3B82F6, #2563EB); }

/* ============================================================
   TRIPWIRES — Semáforos
   ============================================================ */
.tw-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tw {
  background: var(--card-soft);
  border-radius: var(--radius-sm);
  padding: 14px 12px;
  border-left: 4px solid var(--text-muted);
  transition: transform 0.15s;
}
.tw:hover { transform: translateY(-2px); }
.tw.verde_k { border-left-color: var(--keiko); background: linear-gradient(135deg, #FFFBEB, #FED7AA); }
.tw.verde_s { border-left-color: var(--sanchez); background: linear-gradient(135deg, #EFF6FF, #BFDBFE); }
.tw.verde   { border-left-color: var(--green); background: linear-gradient(135deg, #ECFDF5, #A7F3D0); }
.tw.amarillo { border-left-color: var(--yellow); background: linear-gradient(135deg, #FFFBEB, #FEF3C7); }
.tw.rojo     { border-left-color: var(--red); background: linear-gradient(135deg, #FEF2F2, #FECACA); }
.tw-titulo { font-size: 0.62rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.tw-valor { font-size: 1.7rem; font-weight: 800; color: var(--text); line-height: 1; margin: 8px 0 4px; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
.tw-estado { font-size: 0.62rem; color: var(--text-muted); line-height: 1.3; }
.tw-trend { font-size: 0.65rem; color: var(--text); margin-top: 6px; font-variant-numeric: tabular-nums; opacity: 0.85; }
.tw-trend b { font-weight: 800; }

/* ============================================================
   MODELOS GRID — Vista Resumen
   ============================================================ */
.models-grid { display: flex; flex-direction: column; gap: 6px; }
.model-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  background: var(--card-soft);
  border: 1px solid var(--border-soft);
}
.model-row.win-k { border-left: 4px solid var(--keiko); }
.model-row.win-s { border-left: 4px solid var(--sanchez); }
.mr-name { font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
.mr-sub { font-size: 0.7rem; color: var(--text-muted); }
.mr-pct { font-size: 1.3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.mr-pct .pk { color: var(--keiko); }
.mr-pct .ps { color: var(--sanchez); }

/* ============================================================
   CTA buttons
   ============================================================ */
.cta-card { background: linear-gradient(135deg, #FFEDD5, #DBEAFE); }
.cta-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
.cta-buttons button {
  background: white;
  border: 1px solid var(--border);
  padding: 12px 6px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.cta-buttons button:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

/* ============================================================
   SCENARIO PICKER
   ============================================================ */
.scenario-picker {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  background: var(--card-soft);
  padding: 4px;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
}
.scenario-picker .sb {
  background: none;
  border: none;
  padding: 8px 2px;
  border-radius: 10px;
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}
.scenario-picker .sb:hover { color: var(--text); }
.scenario-picker .sb.on {
  background: var(--text);
  color: white;
  box-shadow: var(--shadow-sm);
}

/* ============================================================
   MAPA SVG
   ============================================================ */
.map-wrap {
  position: relative;
  background: var(--card-soft);
  border-radius: var(--radius-sm);
  padding: 8px;
  margin-bottom: 10px;
  border: 1px solid var(--border-soft);
}
.map-wrap svg { width: 100%; height: auto; max-height: 540px; display: block; }
.map-dep { cursor: pointer; transition: opacity 0.15s, stroke-width 0.15s; }
.map-dep:hover { stroke-width: 1.8 !important; stroke: #0F172A; opacity: 0.92; }
.map-tooltip {
  position: absolute; pointer-events: none;
  background: rgba(15,23,42,0.96); color: white;
  padding: 8px 12px; border-radius: 8px;
  font-size: 0.72rem; line-height: 1.4;
  box-shadow: var(--shadow-lg);
  z-index: 10;
  font-variant-numeric: tabular-nums;
  max-width: 200px;
}
.map-tooltip b { font-weight: 800; }
.map-legend { display: flex; flex-direction: column; gap: 4px; padding: 8px 4px 0; }
.ml-row { display: flex; align-items: center; gap: 4px; font-size: 0.66rem; color: var(--text-muted); }
.ml-swatch { width: 16px; height: 12px; border-radius: 2px; display: inline-block; }
.ml-label { margin-left: 6px; }

/* ============================================================
   DEPARTAMENTOS LIST
   ============================================================ */
.dep-list { display: flex; flex-direction: column; gap: 6px; }
.dep-row {
  display: grid;
  grid-template-columns: 110px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--card-soft);
  border-radius: 10px;
  font-size: 0.78rem;
}
.dr-name { font-weight: 700; }
.dr-bar { display: flex; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; min-width: 80px; }
.dr-bk { background: var(--keiko); }
.dr-bs { background: var(--sanchez); }
.dr-pcts { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: 0.74rem; }
.dr-k { color: var(--keiko); font-weight: 700; }
.dr-s { color: var(--sanchez); font-weight: 700; }
.dr-win { display: inline-block; width: 20px; height: 20px; border-radius: 50%; text-align: center; line-height: 20px; font-size: 0.7rem; font-weight: 800; color: white; }
.dr-win.wk { background: var(--keiko); }
.dr-win.ws { background: var(--sanchez); }

/* ============================================================
   TREND TABLE (Velocidades por estrato)
   ============================================================ */
.trend-table { width: 100%; font-size: 0.74rem; font-variant-numeric: tabular-nums; border-collapse: collapse; }
.trend-table th { text-align: right; padding: 8px 6px; font-size: 0.6rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
.trend-table th:first-child { text-align: left; }
.trend-table td { padding: 9px 6px; border-bottom: 1px solid var(--border-soft); text-align: right; }
.trend-table td:first-child { text-align: left; font-weight: 700; }
.trend-table tr:last-child td { border-bottom: none; }
.trend-table td.up { color: var(--keiko); font-weight: 700; }
.trend-table td.down { color: var(--sanchez); font-weight: 700; }
.trend-table td.flat { color: var(--text-muted); }
.trend-table .muted { color: var(--text-muted); font-weight: 500; }

/* ============================================================
   POLLS LIST
   ============================================================ */
.polls-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.poll-row {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 12px;
  align-items: center;
  background: var(--card-soft);
  padding: 10px 12px;
  border-radius: 10px;
}
.pr-meta .pr-name { font-weight: 700; font-size: 0.78rem; }
.pr-meta .pr-date { color: var(--text-muted); font-size: 0.62rem; margin-top: 1px; font-variant-numeric: tabular-nums; }
.pr-meta .pr-n { color: var(--text-faint); font-size: 0.6rem; font-variant-numeric: tabular-nums; }
.pr-bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--border); font-size: 0.62rem; font-weight: 700; color: white; }
.pr-bar > div { display: flex; align-items: center; justify-content: center; min-width: 24px; }
.pb-k { background: var(--keiko); }
.pb-s { background: var(--sanchez); }
.pb-bn { background: var(--text-faint); }
.ancla-box { margin-top: 14px; padding: 12px 14px; background: linear-gradient(135deg, #FFFBEB, #FEF3C7); border-radius: 10px; font-size: 0.74rem; line-height: 1.55; color: var(--text); }
.ancla-box .pk { color: var(--keiko-dark); }
.ancla-box .ps { color: var(--sanchez-dark); }

/* ============================================================
   MOMENTUM TABLE
   ============================================================ */
.mom-table { width: 100%; font-size: 0.74rem; font-variant-numeric: tabular-nums; border-collapse: collapse; }
.mom-table th { text-align: right; padding: 8px 6px; font-size: 0.6rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
.mom-table th:first-child { text-align: left; }
.mom-table td { padding: 9px 6px; border-bottom: 1px solid var(--border-soft); text-align: right; }
.mom-table td:first-child { text-align: left; font-weight: 700; }
.mom-table .tot { background: var(--card-soft); }
.mom-table .tot td { border-bottom: none; padding-top: 12px; }
.mom-table .muted { color: var(--text-muted); font-size: 0.65rem; }
.mom-table .pk { color: var(--keiko); }
.mom-table .ps { color: var(--sanchez); }

/* ============================================================
   MONTE CARLO + POLYMARKET
   ============================================================ */
.mc-card { background: linear-gradient(135deg, #0F172A, #1E293B); color: white; }
.mc-card .card-sub { color: rgba(255,255,255,0.7); }
.mc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.mc-side { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 14px; text-align: center; }
.mc-side.k { border-top: 3px solid var(--keiko); }
.mc-side.s { border-top: 3px solid var(--sanchez); }
.mc-name { font-size: 0.62rem; font-weight: 800; opacity: 0.7; letter-spacing: 0.5px; }
.mc-pct { font-size: 2.4rem; font-weight: 800; margin: 4px 0; line-height: 1; letter-spacing: -1.5px; }
.mc-side.k .mc-pct { color: #FB923C; }
.mc-side.s .mc-pct { color: #60A5FA; }
.mc-lbl { font-size: 0.65rem; opacity: 0.7; }
.mc-ci { font-size: 0.72rem; opacity: 0.85; margin-top: 14px; text-align: center; line-height: 1.55; font-variant-numeric: tabular-nums; }
.mc-ci b { color: white; }

.pm-card { background: linear-gradient(135deg, #ECFDF5, #DBEAFE); }
.pm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pm-side { background: white; border-radius: 12px; padding: 14px; text-align: center; }
.pm-side.k { border-top: 3px solid var(--keiko); }
.pm-side.s { border-top: 3px solid var(--sanchez); }
.pm-name { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }
.pm-pct { font-size: 2rem; font-weight: 800; margin: 6px 0; line-height: 1; font-variant-numeric: tabular-nums; }
.pm-side.k .pm-pct { color: var(--keiko); }
.pm-side.s .pm-pct { color: var(--sanchez); }
.pm-lbl { font-size: 0.65rem; color: var(--text-muted); }
.pm-link { display: inline-block; font-weight: 700; font-size: 0.72rem; }
.pm-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 0.72rem; color: var(--text-muted); }
.pm-foot b { color: var(--text); font-variant-numeric: tabular-nums; }
.pm-fresh { display: inline-block; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.3px; padding: 2px 8px; border-radius: 99px; vertical-align: middle; text-transform: none; }
.pm-fresh.on { background: var(--green-bg); color: #047857; }
.pm-fresh.stale { background: var(--yellow-bg); color: #92400E; }

/* ============================================================
   BISAGRAS TABLE
   ============================================================ */
.bis-table { width: 100%; font-size: 0.72rem; border-collapse: collapse; }
.bis-table th { text-align: right; padding: 6px 4px; font-size: 0.58rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
.bis-table th:first-child { text-align: left; }
.bis-table td { padding: 8px 4px; border-bottom: 1px solid var(--border-soft); text-align: right; font-variant-numeric: tabular-nums; }
.bis-table td:first-child { text-align: left; }
.bis-table .bn { font-weight: 700; }
.bis-table .bs-sub { color: var(--text-muted); font-size: 0.62rem; }
.bis-table .pk { color: var(--keiko); font-weight: 700; }
.bis-table .ps { color: var(--sanchez); font-weight: 700; }

/* ============================================================
   ONEROUND STATS + METHOD
   ============================================================ */
.oneR-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

details.method > summary { cursor: pointer; padding: 14px 16px; background: var(--card); border-radius: var(--radius-sm); font-size: 0.78rem; font-weight: 700; color: var(--text-muted); list-style: none; box-shadow: var(--shadow-sm); border: 1px solid var(--border-soft); }
details.method > summary::-webkit-details-marker { display: none; }
details.method[open] > summary { border-radius: var(--radius-sm) var(--radius-sm) 0 0; color: var(--text); }
details.method > div { background: var(--card); border-radius: 0 0 var(--radius-sm) var(--radius-sm); padding: 16px; font-size: 0.74rem; line-height: 1.65; color: var(--text-muted); border: 1px solid var(--border-soft); border-top: none; }
details.method b { color: var(--text); }

details.method code { background: var(--card-soft); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.7rem; color: var(--keiko-dark); }

/* ============================================================
   FOOTER + SYNC

.footer a { color: var(--sanchez); font-weight: 600; }
.sync-btn { background: var(--text); color: white; border: none; padding: 8px 16px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; cursor: pointer; margin-top: 10px; }

/* ============================================================
   RESPONSIVE

@media (max-width: 480px) {

<body>
<div class="container">

  <!-- Header con countdown + ganador actual proyectado -->
  <div id="global-header"></div>

  <!-- Sub-navegación (4 vistas) -->
  <nav class="subnav" id="subnav">
    <button class="subnav-btn active" data-view="resumen" onclick="switchView('resumen')">
      <span class="snb-icon">🏁</span><span class="snb-label">Resumen</span>
    </button>
    <button class="subnav-btn" data-view="mapa" onclick="switchView('mapa')">
      <span class="snb-icon">🗺️</span><span class="snb-label">Mapa</span>
    </button>
    <button class="subnav-btn" data-view="tendencia" onclick="switchView('tendencia')">
      <span class="snb-icon">📈</span><span class="snb-label">Tendencia</span>
    </button>
    <button class="subnav-btn" data-view="tecnico" onclick="switchView('tecnico')">
      <span class="snb-icon">🔬</span><span class="snb-label">Técnico</span>
    </button>
  </nav>

  <div id="view-container">Cargando proyección 2da vuelta…</div>

  <div class="footer">
    Datos: ONPE (1V oficial) + IPSOS/IEP (timeseries de encuestas).
    Modelo en GitHub: <a href="https://github.com/Perufitlife/peru-2026-tracker" target="_blank">perufitlife/peru-2026-tracker</a>.
    Las proyecciones son cálculos matemáticos, no resultados oficiales.
    <button class="sync-btn" id="syncBtn" onclick="sync()" style="display:none">Actualizar ONPE</button>
  </div>

</div>

<script>
const fmt = n => n.toLocaleString('es-PE');
const titleCase = s => {
  if (!s) return '';
  // toLocaleLowerCase para manejar tildes/ñ correctamente
  return s.toLocaleLowerCase('es-PE').replace(/(^|\s|\(|-|\/|·)([\wáéíóúüñÁÉÍÓÚÜÑ])/g, (m, sep, ch) => sep + ch.toLocaleUpperCase('es-PE'));
};
const badgeClass = p => p >= 90 ? 'b-green' : p >= 80 ? 'b-blue' : p >= 70 ? 'b-yellow' : 'b-red';

function findCand(list, needle) {
  return (list || []).find(c => c.nombreCandidato && c.nombreCandidato.includes(needle));
}

async function load() {
  const [dataRes, svRes, geoRes] = await Promise.all([
    fetch('data.json?t=' + Date.now()).catch(() => null),
    fetch('segunda_vuelta_2026.json?t=' + Date.now()).catch(() => null),
    fetch('peru_geo.json?t=' + Date.now()).catch(() => null),
  ]);
  let data = null, segundaData = null, geoData = null;
  try { data = await dataRes.json(); } catch {}
  try { segundaData = await svRes.json(); } catch {}
  try { geoData = await geoRes.json(); } catch {}
  window._svGeo = geoData;
  window._oneRoundData = data;
  if (segundaData) renderSegundaVuelta(segundaData);
  renderHeader(data, segundaData);
}

const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

async function sync() {
  const btn = document.getElementById('syncBtn');
  if (!isLocal) {
    btn.disabled = true;
    btn.textContent = 'Actualizando...';
    await load();
    setTimeout(() => { btn.textContent = 'Actualizar'; btn.disabled = false; }, 1000);
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Syncing...';
  try {
    const res = await fetch('/api/sync');
    const d = await res.json();
    if (d.status === 'ok') {
      await load();
      btn.textContent = 'Listo!';
      setTimeout(() => { btn.textContent = 'Actualizar'; btn.disabled = false; }, 1000);
    } else {
      btn.textContent = d.status === 'already_running' ? 'En proceso...' : 'Error';
      setTimeout(() => { btn.textContent = 'Actualizar'; btn.disabled = false; }, 2000);
    }
  } catch {
    btn.textContent = 'Error';
    setTimeout(() => { btn.textContent = 'Actualizar'; btn.disabled = false; }, 2000);
  }
}

if (isLocal) {
  const btn = document.getElementById('syncBtn');
  if (btn) btn.style.display = '';
}

// ====================== 2DA VUELTA — KEIKO vs SÁNCHEZ ======================
window._svData = null;
window._svActiveScenario = 'MAS_PROBABLE';
window._svActiveView = 'resumen';
window._svGeo = null;

const DIA_ELECCION = new Date('2026-06-07T00:00:00-05:00');

function diasFaltantes() {
  const now = new Date();
  const d = Math.ceil((DIA_ELECCION - now) / (1000*60*60*24));
  return Math.max(0, d);
}

function renderHeader(oneR, sv) {
  const dias = diasFaltantes();
  let pctK = '—', pctS = '—', label = 'Cargando…';
  if (sv?.escenarios?.MAS_PROBABLE) {
    const n = sv.escenarios.MAS_PROBABLE.nacional;
    pctK = n.pct_keiko.toFixed(1);
    pctS = n.pct_sanchez.toFixed(1);
    label = 'Más Probable (modelo + encuestas + Polymarket)';
  }
  const headerEl = document.getElementById('global-header');
  if (!headerEl) return;
  headerEl.innerHTML = `
    <header class="gh-card">

        <div class="gh-brand">
          <div class="gh-logo">🇵🇪</div>
          <div>
            <div class="gh-title">Elecciones Perú 2026 · 2da Vuelta</div>

      </div>

}

function renderSegundaVuelta(sv) {
  window._svData = sv;
  drawSegundaVuelta();
}

window.switchView = function(view) {
  window._svActiveView = view;
  document.querySelectorAll('.subnav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });

};

function drawSegundaVuelta() {
  const sv = window._svData;
  const container = document.getElementById('view-container');
  if (!container) return;
  if (!sv) { container.innerHTML = '<div class="loading">Cargando proyección…</div>'; return; }
  const view = window._svActiveView || 'resumen';
  let html;
  if (view === 'resumen')   html = renderResumenView(sv);
  else if (view === 'mapa') html = renderMapaView(sv);
  else if (view === 'tendencia') html = renderTendenciaView(sv);
  else if (view === 'tecnico') html = renderTecnicoView(sv);
  container.innerHTML = html;
  if (view === 'mapa') initMapaInteractions(sv);
}

window._svSetScenario = function(sc) {

}

  if (!tripwires || tripwires.length === 0) return '';
  return `

}

// VISTA 2 — MAPA
function renderMapaView(sv) {
  const escK = window._svActiveScenario;

function colorPorMargen(pctK) {
  const m = pctK - 50;
  if (m >= 20) return '#7C2D12';
  if (m >= 10) return '#EA580C';
  if (m >= 3)  return '#FB923C';
  if (m >= 0)  return '#FED7AA';
  if (m >= -3)  return '#BFDBFE';
  if (m >= -10) return '#60A5FA';
  if (m >= -20) return '#2563EB';
  return '#1E3A8A';
}

function normDep(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, '');
}

async function ensureGeo() {
  if (window._svGeo) return window._svGeo;
  try {
    const res = await fetch('peru_geo.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    window._svGeo = await res.json();
    return window._svGeo;
  } catch (e) {
    console.error('peru_geo.json fetch falló:', e);
    return null;
  }
}

async function initMapaInteractions(sv) {
  const svg = document.getElementById('peru-map');
  const tt = document.getElementById('map-tooltip');
  if (!svg) return;
  const geo = await ensureGeo();
  if (!geo) {
    svg.outerHTML = '<div class="card-foot">⚠️ No se pudo cargar el mapa (peru_geo.json no disponible).</div>';
    return;
  }
  const escK = window._svActiveScenario;
  const esc = sv.escenarios[escK];
  const depByName = {};
  esc.departamentos.forEach(d => { depByName[normDep(d.departamento)] = d; });

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  geo.features.forEach(f => {
    if (f.properties.name === 'Lake Titicaca') return;
    const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
    polys.forEach(poly => poly.forEach(ring => ring.forEach(([x, y]) => {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    })));
  });
  const W = 600, H = 700, pad = 20;
  const scale = Math.min((W - 2*pad) / (maxX - minX), (H - 2*pad) / (maxY - minY));
  const offX = (W - (maxX - minX) * scale) / 2 - minX * scale;
  const offY = (H - (maxY - minY) * scale) / 2 + maxY * scale;
  const proj = (x, y) => [x * scale + offX, -y * scale + offY];

  function pathFor(feature) {
    const polys = feature.geometry.type === 'MultiPolygon' ? feature.geometry.coordinates : [feature.geometry.coordinates];
    let d = '';
    polys.forEach(poly => poly.forEach(ring => {
      ring.forEach((pt, i) => {
        const [px, py] = proj(pt[0], pt[1]);
        d += (i === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1);
      });
      d += 'Z';
    }));
    return d;
  }

  function findDep(featureName) {
    if (featureName === 'Lake Titicaca') return null;
    let key = featureName;
    if (key === 'El Callao') key = 'CALLAO';
    if (key === 'Lima Province') key = 'LIMA';
    return depByName[normDep(key)];
  }

  let svgContent = '';
  geo.features.forEach(f => {
    const dep = findDep(f.properties.name);
    if (!dep) {
      svgContent += `<path d="${pathFor(f)}" fill="#E5E7EB" stroke="white" stroke-width="0.5"/>`;
      return;
    }
    const color = colorPorMargen(dep.pct_keiko);
    svgContent += `<path d="${pathFor(f)}" fill="${color}" stroke="white" stroke-width="0.6" class="map-dep" data-dep="${dep.departamento}" data-pctk="${dep.pct_keiko}" data-pcts="${dep.pct_sanchez}"/>`;
  });
  svg.innerHTML = svgContent;

  svg.querySelectorAll('.map-dep').forEach(el => {
    el.addEventListener('mouseenter', e => {
      const dep = e.target.dataset.dep;
      const pK = parseFloat(e.target.dataset.pctk);
      const pS = parseFloat(e.target.dataset.pcts);
      const win = pK > pS ? 'KEIKO' : 'SÁNCHEZ';
      tt.innerHTML = `<b>${titleCase(dep)}</b><br>K ${pK.toFixed(1)}% · S ${pS.toFixed(1)}%<br>Gana <b style="color:${pK > pS ? '#F97316' : '#3B82F6'}">${win}</b>`;
      tt.style.display = 'block';
    });
    el.addEventListener('mousemove', e => {
      const rect = svg.getBoundingClientRect();
      tt.style.left = (e.clientX - rect.left + 10) + 'px';
      tt.style.top = (e.clientY - rect.top + 10) + 'px';
    });
    el.addEventListener('mouseleave', () => { tt.style.display = 'none'; });
  });
}

// VISTA 3 — TENDENCIA
function renderTendenciaView(sv) {
  const pts = sv.polls_timeseries || {};
  const tw = pts.tripwires || [];
  const vel = pts.velocidades || {};
  const polls = pts.polls_resumen || [];
  const ancla = pts.anclaje_doble;
  const momentum = pts.escenario_momentum;

  function trendCell(d, isS) {
    if (!d) return '<td class="flat">—</td>';
    const cls = d.delta_pp > 0.3 ? (isS ? 'down' : 'up')
              : d.delta_pp < -0.3 ? (isS ? 'up' : 'down')
              : 'flat';
    const arrow = d.delta_pp > 0.3 ? '▲' : d.delta_pp < -0.3 ? '▼' : '→';
    return `<td class="${cls}">${arrow} ${d.v1}→<b>${d.v2}</b> <span class="muted">(${d.pp_por_semana > 0 ? '+' : ''}${d.pp_por_semana}/sem)</span></td>`;
  }

  return `
    <div class="card">
      <div class="card-title">🚦 Tripwires en detalle</div>
      <div class="card-sub">Los 3 indicadores cuya evolución decide el resultado.</div>
      ${renderTripwiresInline(tw)}
      <div class="card-foot">Naranja = favorable a Keiko. Azul = favorable a Sánchez. Amarillo = zona de batalla. Rojo = volátil.</div>
    </div>

    ${vel?.lima_metro ? `
    <div class="card">
      <div class="card-title">📈 Velocidad por estrato — IPSOS abr → may (${vel.semanas_intervalo} semanas)</div>
      <div class="card-sub">Quién va ganando puntos por semana. ▲ sube, ▼ baja.</div>
      <table class="trend-table">
        <thead><tr><th>Estrato</th><th>Keiko</th><th>Sánchez</th><th>Blanco/Nulo</th></tr></thead>
        <tbody>
          <tr><td>Lima Metro</td>${trendCell(vel.lima_metro.k, false)}${trendCell(vel.lima_metro.s, true)}${trendCell(vel.lima_metro.blanco_nulo, false)}</tr>
          <tr><td>Otras ciudades</td>${trendCell(vel.otras_ciudades.k, false)}${trendCell(vel.otras_ciudades.s, true)}${trendCell(vel.otras_ciudades.blanco_nulo, false)}</tr>
          <tr><td>Rural</td>${trendCell(vel.rural.k, false)}${trendCell(vel.rural.s, true)}${trendCell(vel.rural.blanco_nulo, false)}</tr>
        </tbody>
      </table>
      <div class="card-foot"><b>Lectura clave:</b> Lima se polariza pro-Keiko. En interior y rural Sánchez sangra, pero el voto perdido NO va a Keiko — va a indecisos. Eso es lo que captura Momentum.</div>
    </div>` : ''}

    ${polls.length > 0 ? `
    <div class="card">
      <div class="card-title">📚 Timeseries de encuestas (${polls.length} mediciones)</div>
      <div class="card-sub">Append-only. Cada encuesta nueva entra a polls.json y todo recalcula.</div>
      <div class="polls-list">
        ${polls.slice().sort((a,b) => (a.fecha_campo[1] < b.fecha_campo[1] ? 1 : -1)).map(p => {
          const k = p.nacional?.k || 0, s = p.nacional?.s || 0;
          const bn = p.nacional?.blanco_nulo || 0, ind = p.nacional?.indeciso || 0;
          return `
          <div class="poll-row">
            <div class="pr-meta">
              <div class="pr-name">${p.pollster}</div>
              <div class="pr-date">${p.fecha_campo[0]} → ${p.fecha_campo[1]}</div>
              <div class="pr-n">n=${fmt(p.n)}</div>
            </div>
            <div class="pr-bar">
              <div class="pb-k" style="width:${k}%">${k}</div>
              <div class="pb-s" style="width:${s}%">${s}</div>
              <div class="pb-bn" style="width:${bn + ind}%">${bn + ind}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      ${ancla ? `
      <div class="ancla-box">
        <b>Promedio ponderado por recencia (τ=${ancla.tau_dias} días):</b><br>
        K <b class="pk">${ancla.promedio_ponderado.val_k}%</b> · S <b class="ps">${ancla.promedio_ponderado.val_s}%</b> sobre voto válido. Última encuesta pesa ~${(ancla.items[ancla.items.length-1].peso_norm*100).toFixed(0)}%.
      </div>` : ''}
    </div>` : ''}

    ${momentum ? `
    <div class="card">
      <div class="card-title">🚀 Escenario Momentum — proyección al día D</div>
      <div class="card-sub">Extrapola la velocidad por estrato ${momentum.dias_proyectados} días hacia adelante (con 50% dampening) + reparte el limbo con prior histórico Perú 2da vuelta.</div>
      <table class="mom-table">
        <thead><tr><th>Estrato</th><th>Hoy K</th><th>Hoy S</th><th>Día D K</th><th>Día D S</th></tr></thead>
        <tbody>
          ${['lima_metro','otras_ciudades','rural'].map(e => {
            const m = momentum.estratos[e];
            const labels = { lima_metro:'Lima Metro', otras_ciudades:'Otras ciudades', rural:'Rural' };
            return `<tr><td>${labels[e]}</td><td>${m.pre_reparto.k}%</td><td>${m.pre_reparto.s}%</td><td><b class="pk">${m.final_valido.k}%</b></td><td><b class="ps">${m.final_valido.s}%</b></td></tr>`;
          }).join('')}
          <tr class="tot">
            <td><b>NACIONAL</b></td><td colspan="2" class="muted">ponderado por estrato</td>
            <td><b class="pk">${momentum.nacional_valido.k}%</b></td>
            <td><b class="ps">${momentum.nacional_valido.s}%</b></td>
          </tr>
        </tbody>
      </table>
    </div>` : ''}
  `;
}

// VISTA 4 — TÉCNICO
function renderTecnicoView(sv) {
  const scKey = window._svActiveScenario;
  const esc = sv.escenarios[scKey];
  const nac = esc.nacional;
  const mc = sv.monte_carlo;
  const pm = sv.escenarios?.MAS_PROBABLE?.blend?.polymarket;
  const bisagras = (sv.bisagra || []).filter(b => b.validos_proy > 3000).slice(0, 20);
  const oneR = window._oneRoundData;

  return `
    <div class="card">
      <div class="card-title">🎯 Selector de escenarios</div>
      <div class="card-sub">Compara cómo cambia el resultado bajo cada hipótesis.</div>
      <div class="scenario-picker">${renderScenarioButtons(scKey)}</div>
    </div>

    <div class="card hero-card ${nac.ganador === 'Keiko' ? 'hero-k' : 'hero-s'}">
      <div class="hero-label">${esc.label}</div>
      <div class="hero-pcts">
        <div class="hp-side k"><div class="hp-name">Keiko</div><div class="hp-pct">${nac.pct_keiko.toFixed(2)}%</div><div class="hp-votes">${fmt(nac.keiko)}</div></div>
        <div class="hp-vs">vs</div>
        <div class="hp-side s"><div class="hp-name">Sánchez</div><div class="hp-pct">${nac.pct_sanchez.toFixed(2)}%</div><div class="hp-votes">${fmt(nac.sanchez)}</div></div>
      </div>
      <div class="hero-margin">Margen: <b>${fmt(Math.abs(nac.margen))}</b> votos · ganador: <b>${nac.ganador}</b></div>
    </div>

    ${mc ? `
    <div class="card mc-card">
      <div class="card-title light">🎲 Monte Carlo · ${fmt(mc.n_sims)} simulaciones</div>
      <div class="mc-grid">
        <div class="mc-side k"><div class="mc-name">KEIKO</div><div class="mc-pct">${mc.prob_keiko_gana}%</div><div class="mc-lbl">prob. de ganar</div></div>
        <div class="mc-side s"><div class="mc-name">SÁNCHEZ</div><div class="mc-pct">${mc.prob_sanchez_gana}%</div><div class="mc-lbl">prob. de ganar</div></div>
      </div>
      <div class="mc-ci">
        Mediana: <b>K ${mc.mediana_pct_keiko}% / S ${mc.mediana_pct_sanchez}%</b><br>
        Intervalo 80% Keiko: [${mc.ci80_keiko[0]}%, ${mc.ci80_keiko[1]}%] · 95%: [${mc.ci95_keiko[0]}%, ${mc.ci95_keiko[1]}%]
      </div>
    </div>` : ''}

    ${pm ? (() => {
      const pmFetchedAgo = pm.fetched_at ? Math.round((Date.now() - new Date(pm.fetched_at).getTime())/60000) : null;
      const pmAgoLabel = pmFetchedAgo == null ? '' : pmFetchedAgo < 60 ? `hace ${pmFetchedAgo} min` : pmFetchedAgo < 1440 ? `hace ${Math.round(pmFetchedAgo/60)} h` : `hace ${Math.round(pmFetchedAgo/1440)} días`;
      const pK = Math.round(pm.prob_keiko_gana * 100);
      const pS = Math.round((pm.prob_sanchez_gana != null ? pm.prob_sanchez_gana : (1 - pm.prob_keiko_gana)) * 100);
      return `
    <div class="card pm-card">
      <div class="card-title">💰 Polymarket en vivo ${pmFetchedAgo != null ? `<span class="pm-fresh ${pmFetchedAgo < 90 ? 'on' : 'stale'}">● ${pmAgoLabel}</span>` : ''}</div>
      <div class="card-sub">$${(pm.volumen_usd/1e6).toFixed(1)}M apostado · $${pm.volumen_24h_usd ? Math.round(pm.volumen_24h_usd/1000) : 0}K en 24h. Smart money en tiempo real.</div>
      <div class="pm-grid">
        <div class="pm-side k"><div class="pm-name">Keiko</div><div class="pm-pct">${pK}¢</div><div class="pm-lbl">prob. ganar</div></div>
        <div class="pm-side s"><div class="pm-name">Sánchez</div><div class="pm-pct">${pS}¢</div><div class="pm-lbl">prob. ganar</div></div>
      </div>
      <div class="pm-foot">
        <span>%K voto implícito: <b>${pm.pct_k_implied}%</b></span>
        <a href="${pm.url}" target="_blank" class="pm-link">Ver mercado →</a>
      </div>
    </div>`;
    })() : ''}

    <div class="card">
      <div class="card-title">🏛️ Por departamento (${esc.label})</div>
      <div class="dep-list">
        ${[...esc.departamentos].sort((a,b) => b.pct_keiko - a.pct_keiko).map(d => `
          <div class="dep-row">
            <div class="dr-name">${titleCase(d.departamento)}</div>
            <div class="dr-bar"><div class="dr-bk" style="width:${d.pct_keiko}%"></div><div class="dr-bs" style="width:${d.pct_sanchez}%"></div></div>
            <div class="dr-pcts"><span class="dr-k">${d.pct_keiko.toFixed(1)}%</span> <span class="dr-s">${d.pct_sanchez.toFixed(1)}%</span> <span class="dr-win ${d.ganador === 'K' ? 'wk' : 'ws'}">${d.ganador}</span></div>
          </div>
        `).join('')}
      </div>
    </div>

    ${bisagras.length > 0 ? `
    <div class="card">
      <div class="card-title">🎯 Distritos bisagra (margen <8pp)</div>
      <div class="card-sub">Donde el resultado puede voltearse. Comparación entre escenarios.</div>
      <table class="bis-table">
        <thead><tr><th>Distrito</th><th>Pes K</th><th>Encuestas</th><th>Opt K</th></tr></thead>
        <tbody>
          ${bisagras.map(p => `
            <tr>
              <td><div class="bn">${titleCase(p.distrito)}</div><div class="bs-sub">${titleCase(p.provincia)}, ${titleCase(p.departamento)} · ${fmt(p.validos_proy)} val</div></td>
              <td class="ps">${(p.pct_keiko_pesimista ?? 0).toFixed(1)}%</td>
              <td><b>${p.pct_keiko_encuestas.toFixed(1)}%</b></td>
              <td class="pk">${(p.pct_keiko_optimista ?? 0).toFixed(1)}%</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>` : ''}

    ${oneR?.nacional ? `
    <div class="card">
      <div class="card-title">🗳️ Contexto: 1V 2026 (data oficial ONPE)</div>
      <div class="card-sub">De aquí salen los votos K y S "base" para calibrar la 2V.</div>
      <div class="oneR-stats">
        <div><div class="orl">Participación</div><div class="orv">81.3%</div></div>
        <div><div class="orl">Blanco/Nulo</div><div class="orv">13.8%</div></div>
        <div><div class="orl">Padrón hábil</div><div class="orv">27.3M</div></div>
      </div>
    </div>` : ''}

    <details class="method">
      <summary>📐 Metodología completa</summary>
      <div>
        <p><b>Granularidad:</b> 1,892 distritos. Cada distrito se proyecta individualmente.</p>
        <p><b>Calibración encuestas:</b> bisección por zona IEP (Lima Metro / Costa Norte / Costa Sur / Sierra Centro / Sierra Sur / Oriente) hasta que el agregado iguala el target IEP. Dentro de cada zona, voto "otros" se distribuye por % Castillo 1V 2021.</p>
        <p><b>Modelo propio:</b> continuity_factor × ajuste_castillo_personal × ajuste_urbano + antivoto K + efecto recta final 2016. RMSE 11pp por distrito (validación cruzada).</p>
        <p><b>Blend MAS_PROBABLE:</b> 30% modelo + 45% encuestas + 25% Polymarket.</p>
        <p><b>Momentum:</b> velocidades IPSOS por estrato extrapoladas al día D con dampening 0.5 + reparto del limbo con prior 55% líder / 30% rezagado / 15% nulo (+10% bonus al líder anti-castillista).</p>
        <p><b>Monte Carlo:</b> 5,000 sims con incertidumbre en peso del blend, antivoto, recta final 2016, voto extranjero y ruido zonal.</p>
        <p><b>Workflow día a día:</b> <code>node add-poll.js encuesta.json</code> valida + appendea + regenera todo.</p>
      </div>
    </details>
  `;
}

load();
</script>
</body>
</html>
